# Publish @syniq/syniq-mcp when a GitHub Release is published.
# One-time setup on npm: package Settings → Trusted Publisher → link this repo/workflow.
# Docs: https://docs.npmjs.com/trusted-publishers

name: Publish Syniq MCP

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and verify package
        working-directory: mcp/syniq-mcp
        run: |
          npm ci
          npm run check
          npm pack --dry-run

      - name: Publish to npm
        working-directory: mcp/syniq-mcp
        run: npm publish --provenance --access public
